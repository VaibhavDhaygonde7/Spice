<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101210">
    <meta name="description" content="Your music, on your terms. An offline local music player for Linux.">
    <title>Spice — Local music, limitless feeling.</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="studio.css">
    <link rel="stylesheet" href="reading.css">
    <link rel="stylesheet" href="glass.css">
    <script src="app.js" defer></script>
    <script src="signal.js" defer></script>
    <script src="studio.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <a class="brand" href="#home" aria-label="Spice home"><img src="icon.svg" alt="" width="34"
                    height="34"><span>spice<span class="brand-dot">.</span></span><span
                    class="local-label">LOCAL</span></a>
            <nav class="primary-nav"><button data-view="home" class="nav-item active"><span
                        data-icon="home"></span>Home</button><button data-view="search" class="nav-item"><span
                        data-icon="search"></span>Search<span class="keyhint">/</span></button><button
                    id="sidebar-studio" class="nav-item listening-link" title="Listening room (V)"
                    aria-label="Listening room"><span data-icon="headphones"></span>Listening room</button></nav>
            <div class="library-heading"><span data-icon="library"></span><span>Your library</span><button
                    id="new-playlist" class="icon-button" title="Create playlist" aria-label="Create playlist"><span
                        data-icon="plus"></span></button></div>
            <nav class="collection-nav"><button data-view="tracks" class="nav-item"><span data-icon="music"></span>All
                    songs<span id="side-count" class="count">0</span></button><button data-view="albums"
                    class="nav-item"><span data-icon="disc"></span>Albums</button><button data-view="artists"
                    class="nav-item"><span data-icon="artist"></span>Artists</button><button data-view="playlists"
                    class="nav-item mobile-playlists"><span data-icon="queue"></span>Playlists</button><button
                    data-view="liked" class="nav-item"><span data-icon="heart"></span>Liked songs</button></nav>
            <div class="sidebar-divider"></div>
            <div class="overline playlists-label">YOUR PLAYLISTS</div>
            <div id="playlist-nav" class="playlist-nav"></div>
            <div class="sidebar-bottom"><button id="sidebar-import" class="add-music" aria-label="Add your music"><span
                        data-icon="folder-plus"></span><span>Add your music<small>Good things start
                            here.</small></span><span data-icon="plus"></span></button><button id="settings"
                    class="nav-item settings-link"><span data-icon="settings"></span>Settings & appearance</button>
                <div class="local-status"><span></span>On your laptop. Always yours.</div>
            </div>
        </aside>
        <div class="main-shell">
            <header class="topbar">
                <div class="history-controls"><button id="back" class="icon-button" aria-label="Go back"
                        title="Go back"><span data-icon="chevron-left"></span></button><button id="forward"
                        class="icon-button" aria-label="Go forward" title="Go forward"><span
                            data-icon="chevron-right"></span></button></div>
                <div id="breadcrumb">Your listening space</div>
                <div class="topbar-right"><button id="open-studio" class="icon-button studio-launch"
                        title="Open visualizer (V)" aria-label="Open visualizer"><span
                            data-icon="headphones"></span><span>Visualizer</span></button><span
                        class="offline-badge"><span data-icon="offline"></span>100% offline</span><button
                        class="icon-button glass-toggle" data-glass-toggle aria-label="Glass appearance"
                        aria-pressed="false" title="Glass appearance"><span data-icon="glass"></span></button><button
                        id="theme-shortcut" class="icon-button" title="Appearance" aria-label="Appearance"><span
                            data-icon="palette"></span></button>
                    <div class="avatar" title="Your local profile">You</div>
                </div>
            </header>
            <main id="main" tabindex="-1"></main>
        </div>
        <aside id="queue-panel" class="queue-panel" hidden>
            <div class="section-heading">
                <h2>Play queue</h2><button id="close-queue" class="icon-button" aria-label="Close queue"><span
                        data-icon="close"></span></button>
            </div>
            <div id="queue-content"></div>
        </aside>
        <footer class="player" aria-label="Music player">
            <div class="now-playing">
                <div id="player-cover" class="mini-cover idle-cover"><span data-icon="music"></span></div>
                <div class="now-copy">
                    <div id="player-title">A little silence, for now.</div>
                    <div id="player-artist">Your next favorite is already on your laptop.</div>
                </div><button id="player-like" class="icon-button" aria-label="Like current song"
                    title="Like current song" disabled><span data-icon="heart"></span></button>
            </div>
            <div class="transport">
                <div class="transport-buttons"><button id="shuffle" class="icon-button" aria-label="Shuffle"
                        aria-pressed="false" title="Shuffle"><span data-icon="shuffle"></span></button><button
                        id="previous" class="icon-button" aria-label="Previous song" title="Previous song"><span
                            data-icon="previous"></span></button><button id="play" class="play-toggle" aria-label="Play"
                        title="Play / pause (Space)"><span data-icon="play"></span></button><button id="next"
                        class="icon-button" aria-label="Next song" title="Next song"><span
                            data-icon="next"></span></button><button id="repeat" class="icon-button"
                        aria-label="Repeat off" title="Repeat: off" aria-pressed="false"><span
                            data-icon="repeat"></span></button></div>
                <div class="progress-row"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100"
                        value="0" step=".1" aria-label="Playback position" disabled><span id="duration">0:00</span>
                </div>
            </div>
            <div class="player-tools"><button id="queue-toggle" class="icon-button" aria-label="Show queue"
                    title="Play queue"><span data-icon="queue"></span></button><span class="tool-divider"></span><button
                    id="mute" class="icon-button" aria-label="Mute" title="Mute"><span
                        data-icon="volume"></span></button><input id="volume" type="range" min="0" max="1" step=".01"
                    value=".7" aria-label="Volume"><button id="focus-player" class="icon-button"
                    aria-label="Open listening room" title="Open visualizer (V)"><span
                        data-icon="expand"></span></button></div>
        </footer>
    </div>
    <dialog id="modal">
        <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div><audio id="audio" preload="metadata"></audio>
</body>

</html>
